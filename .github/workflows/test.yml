---
name: Test Code Base

on:
  workflow_call:

jobs:
  build:
    name: Test Code Base
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Run unit tests
        run: make unit-tests
