---
name: Lint Code Base

on:
  workflow_call:

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Run lint checks
        run: tox run -e lint
