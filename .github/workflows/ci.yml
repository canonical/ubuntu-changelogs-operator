---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  linter:
    uses: ./.github/workflows/linter.yml
  test:
    uses: ./.github/workflows/test.yml
  build-charm:
    needs: [linter, test]
    uses: ./.github/workflows/build-charm.yml
    secrets:
      CHARMCRAFT_TOKEN: ${{ secrets.CHARMCRAFT_TOKEN }}
