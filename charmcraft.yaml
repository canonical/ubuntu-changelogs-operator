# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: ubuntu-changelogs-operator
title: Ubuntu Changelogs Operator
summary: The operator charm behind https://changelogs.ubuntu.com/
description: |
  Sets up a web server to serve Ubuntu meta-relase information and package changelogs.

links:
  source: https://github.com/ubuntu/ubuntu-changelogs-operator
  issues: https://github.com/ubuntu/ubuntu-changelogs-operator/issues

base: ubuntu@26.04
platforms:
  amd64:
  arm64:

assumes:
  - juju >= 3.6

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
  files:
    plugin: dump
    source: files
    organize:
      "*": files/

charm-libs:
  - lib: traefik_k8s.ingress
    version: "2"

config:
  options:
    hostname:
      type: string
      default: "changelogs.ubuntu.com"
      description: |
        The hostname for the changelogs charm
    meta_release_ref:
      type: string
      default: main
      description: |
        The git ref from which to pull the meta-release information.

actions:
  pull-changelogs:
    description: Trigger the changelog extractor if it's not already running.
    additionalProperties: false

requires:
  ingress_changelogs:
    interface: ingress
    limit: 1
    optional: true
